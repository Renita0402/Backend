// Task3

let price = 5000;

let result = new Promise((resolve, reject) => {
    if (price <= 0) {
        reject("Invalid Price");
    } else {
        let discount = price * 10 / 100;
        let finalPrice = price - discount;

        resolve(finalPrice);
    }
});

result
    .then((price) => {
        console.log("Discounted Price:", price);
    })
    .catch((error) => {
        console.log(error);
    })
    .finally(() => {
        console.log("Calculation Completed");
    });
