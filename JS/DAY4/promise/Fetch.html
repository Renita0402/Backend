    const showing = document.getElementById("showData")

     fetch("https://jsonplaceholder.typicode.com/users").then((res)=>{

            throw new Error("HTTP Error : "+res.status)
        }

           return res.json()

       }).then((data)=>{

            let users = data

            console.log(users);
      
           let myDatas = ""

           users.forEach(element => {

            myDatas += `<h2>
                
                Username: ${element.name},
                Email: ${element.email}
                
                </h2>`
            
           });

           showing.innerHTML = myDatas
