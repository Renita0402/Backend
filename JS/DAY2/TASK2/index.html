    <h1>SIMPLE CALCULATOR</h1>
    <script>

const add = (a,b)=>{

    return a + b
}


const sub = (a,b)=>{

    return a - b
}
    
const multiplication = (a,b)=>{

    return a * b
    
}

const  divide = (a,b)=>{

    return a * b
    
}


console.log(add(20, 10));
console.log(sub(20, 10));
console.log(multiplication(20, 10));
console.log(divide(20, 10));

    </script>
